name: Application CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONWARNINGS: error
      DISABLE_BACKGROUND_WORKERS: "1"
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-hashes.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-hashes.txt

      - name: Install Noema agent optional dependency
        # Installs pydantic-ai (services/noema_agent.py) so the real build-path
        # test (test_agent_runs_tools_with_test_model) executes instead of being
        # skipped. Keep the core and agent lock files on the same pip command so
        # --require-hashes can validate both preinstalled shared dependencies and
        # agent-only packages.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            -r backend/requirements-hashes.txt \
            -r backend/requirements-agent.txt

      - name: Run backend lint
        run: |
          cd backend
          python -m ruff check .

      - name: Generate ephemeral CI runtime secret
        run: |
          python - <<'PY'
          import os
          import secrets

          value = "Ci9!" + secrets.token_urlsafe(48)
          print(f"::add-mask::{value}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AUTH_SESSION_HMAC_SECRET={value}\n")
          PY

      - name: Run database migrations
        run: |
          cd backend
          python scripts/migrate_db.py

      - name: Run backend tests
        run: |
          set -o pipefail
          cd backend
          python -m pytest -q 2>&1 | tee pytest_output.log
          if grep -qiE 'timeout|fatal|warn|denied' pytest_output.log; then
            echo "::error::Tests produced Timeout, Fatal, Warn, or Denied outputs"
            exit 1
          fi

      - name: Run repository-root governance contract tests
        # tests/ (repo root) holds workflow/YAML contract tests, e.g.
        # test_stacked_pr_workflow_contract.py. The backend job's own pytest
        # invocation above runs from backend/ and never collects this
        # directory, so it needs its own explicit step. Mirrors that step's
        # own log scan: a warning-class message pytest prints without
        # actually failing the run must not be accepted as clean evidence.
        run: |
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee root_pytest_output.log
          if grep -qiE 'timeout|fatal|warn|denied' root_pytest_output.log; then
            echo "::error::Root governance contract tests produced Timeout, Fatal, Warn, or Denied outputs"
            exit 1
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        run: corepack enable pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: cd frontend && pnpm test

      - name: Run frontend lint
        run: cd frontend && pnpm run lint

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Build frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: |
          rm -f ~/package-lock.json
          cd frontend && pnpm run build

      - name: Install Playwright Chromium
        run: cd frontend && pnpm exec playwright install --with-deps chromium

      - name: Run full product smoke
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NARUON_FULL_PRODUCT_BASE_URL: "http://127.0.0.1:3001"
          NARUON_FULL_PRODUCT_SCREENSHOT_DIR: "/tmp/naruon-full-product-smoke"
        run: cd frontend && pnpm run full:smoke
