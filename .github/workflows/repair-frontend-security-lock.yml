name: Repair frontend security lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/frontend/frontend-npm-2ebebc913d

permissions:
  contents: write

concurrency:
  group: repair-frontend-security-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/npm_and_yarn/frontend/frontend-npm-2ebebc913d
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable repository pnpm
        run: corepack enable pnpm

      - name: Patch reviewed dependency floors
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          package_path = pathlib.Path("frontend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["dependencies"]["next"] = "16.3.4"
          package["devDependencies"]["eslint-config-next"] = "16.3.4"
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          workspace_path = pathlib.Path("frontend/pnpm-workspace.yaml")
          workspace = workspace_path.read_text(encoding="utf-8")
          workspace, replacements = re.subn(
              r'(?m)^(  sharp:\s*)["\']?0\.35\.0["\']?\s*$',
              r'\1"0.35.4"',
              workspace,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("expected exactly one sharp 0.35.0 override")
          workspace_path.write_text(workspace, encoding="utf-8")
          PY

      - name: Regenerate lock from registry metadata
        run: |
          cd frontend
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Verify frontend behavior
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_BUILD_CPUS: "2"
          POSTCSS_WORKERS: "1"
          DISABLE_POSTCSS_WORKERS: "true"
        run: |
          cd frontend
          pnpm test
          pnpm run lint
          pnpm run typecheck
          pnpm run build

      - name: Verify reviewed security floors
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path("frontend")
          package = json.loads((root / "package.json").read_text(encoding="utf-8"))
          if package["dependencies"]["next"] != "16.3.4":
              raise SystemExit("Next.js security patch was not applied")
          if package["devDependencies"]["eslint-config-next"] != "16.3.4":
              raise SystemExit("eslint-config-next is not aligned with Next.js")
          workspace = (root / "pnpm-workspace.yaml").read_text(encoding="utf-8")
          if not re.search(r'(?m)^  sharp:\s*["\']?0\.35\.4["\']?\s*$', workspace):
              raise SystemExit("sharp security patch was not applied")
          lock = (root / "pnpm-lock.yaml").read_text(encoding="utf-8")
          for vulnerable in ("next@16.3.1", "sharp@0.35.0"):
              if vulnerable in lock:
                  raise SystemExit(f"vulnerable lock entry remains: {vulnerable}")
          for patched in ("next@16.3.4", "sharp@0.35.4"):
              if patched not in lock:
                  raise SystemExit(f"patched lock entry missing: {patched}")
          PY

      - name: Remove one-shot source-fix workflow
        run: rm .github/workflows/repair-frontend-security-lock.yml

      - name: Verify bounded source delta
        run: |
          git diff --check
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/repair-frontend-security-lock.yml|frontend/package.json|frontend/pnpm-lock.yaml|frontend/pnpm-workspace.yaml) ;;
              *) echo "::error::unexpected source-fix delta: $path"; unexpected=1 ;;
            esac
          done < <(git diff --name-only)
          test "$unexpected" -eq 0

      - name: Publish repaired source and remove workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/pnpm-lock.yaml frontend/pnpm-workspace.yaml
          git add -u .github/workflows/repair-frontend-security-lock.yml
          git diff --cached --check
          git commit -m "fix(deps): patch Next.js and sharp security floors"
          cat >/tmp/git-askpass.sh <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *Password*) echo "$GITHUB_TOKEN" ;;
          esac
          SH
          chmod 700 /tmp/git-askpass.sh
          GIT_ASKPASS=/tmp/git-askpass.sh GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          rm -f /tmp/git-askpass.sh
